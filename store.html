<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lay Bisuteria - Tienda</title>
    <link href="store.css" rel="stylesheet">
    <link href="Header.css" rel="stylesheet">
    <link href="footer.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">Lay Bisuteria</div>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="About_Me.html">Acerca de Mi</a>
        <a href="#">Tienda</a>
        <a href="contact.html">Contacto</a>
    </nav>

    <div class="container">
        <div class="filters">
            <div class="filter-group">
                <span class="filter-label">Category</span>
                <select id="categoryFilter">
                    <option value="all">All Jewelry</option>
                    <option value="earrings">Earrings</option>
                    <option value="necklace">Necklaces</option>
                    <option value="bracelet">Bracelets</option>
                    <option value="brooch">Brooches</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Material</span>
                <select id="materialFilter">
                    <option value="all">All Materials</option>
                    <option value="gold">Gold</option>
                    <option value="silver">Silver</option>
                    <option value="pearl">Pearl</option>
                    <option value="crystal">Crystal</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Price</span>
                <select id="priceFilter">
                    <option value="all">All Prices</option>
                    <option value="0-20">£0 - £20</option>
                    <option value="20-40">£20 - £40</option>
                    <option value="40-60">£40 - £60</option>
                    <option value="60+">£60+</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Sort</span>
                <select id="sortFilter">
                    <option value="newest">Newest</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded from Firebase -->
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">
                Loading products...
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Store JavaScript -->
    <script src="store.js"></script>
</body>

</html>
