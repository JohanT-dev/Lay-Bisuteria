<!DOCTYPE html>
<html lang="es">

<head>

    <link href="contact.css" rel="stylesheet">
    <link href="Header.css" rel="stylesheet">
    <link href="footer.css" rel="stylesheet">
 <script type="module" src="auth-state.js"></script>

<body>
    <header>
        <div class="logo">Lay Bisuteria</div>
        <a href="login.html" class="login-btn">Login</a>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="About_Me.html">Acerca de Mi</a>
        <a href="store.html">Tienda</a>
        <a href="contact.html">Contacto</a>
    </nav>
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-info">
                <h2>Contacto</h2>
                <p>¿Tienes una idea, una duda o quieres algo hecho especialmente para ti? ¡Escríbeme! Me encantará ayudarte a crear tu joya ideal.</p>

                <div class="contact-details">
                    <div class="contact-item">
                        <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke-width="2"></rect>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z">
                            </path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke-width="2" stroke-linecap="round"></line>
                        </svg>
                        <div class="contact-text">
                            <div>Lay_Bisuteria</div>
                            <div>By Luli</div>
                        </div>
                    </div>

                    <div class="contact-item">
                        <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                            </path>
                        </svg>
                        <div class="contact-text">(507) 6931-8590</div>
                    </div>

                </div>
            </div>

            <form class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstName">Nombre</label>
                        <input class="form-input" type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastName">Apellido</label>
                        <input class="form-input" type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label" for="phone">Telefono</label>
                    <input class="form-input" type="tel" id="phone" name="phone">
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label class="form-label" for="message">Mensaje</label>
                    <textarea class="form-textarea" id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar Mensaje</button>
            </form>
        </div>
    </section>
       <footer>
    <div class="footer-content">
      <div class="contact-item">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
        <a href="tel:+1234567890"> (507) 6931-8590</a>
      </div>

      <div class="contact-item">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
        </svg>
        <a href="https://instagram.com/yourusername" target="_blank" rel="noopener noreferrer">@Lay_Bisuteria</a>
      </div>
    </div>
  </footer>
</body>

</html>
